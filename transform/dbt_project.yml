name: grocery_growth
version: "1.0.0"
config-version: 2
profile: grocery_growth

model-paths: ["models"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  raw_path: "../data/raw"
  first_full_week: 2   # week 1 is a single day (2017-01-01)
  last_week: 53        # Dec 26, 2017 to Jan 1, 2018

models:
  grocery_growth:
    staging:
      +materialized: table   # tables, not views: views would keep a relative CSV path
    marts:
      +materialized: table
    reporting:
      +materialized: table
